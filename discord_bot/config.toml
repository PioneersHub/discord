[programme_notifications]
timezone = "Europe/Berlin"
timewarp = false
# general programme notifications are send 5 minutes before the session, and
# room notifications are send 2 minutes before the session
timewarp_time = "2026-07-18T11:39:50+02:00"                                                                                                                                                                         # room notification
conference_days_first = "2026-07-18"
conference_days_last = "2026-07-23"
conference_afternoon_session_start_time = 13
pretalx_schedule_url = "https://pretalx.com/api/events/euroscipy-2026/schedules/latest/?expand=slots,slots.room,slots.submission,slots.submission.speakers,slots.submission.submission_type,slots.submission.track"
pretalx_talk_url = "https://pretalx.com/euroscipy-2026/talk/{code}"
video_url = "https://euroscipy.org"
# URL templates for the livestream and Q&A links. They support the
# {video_url} and {code} placeholders, e.g. "{video_url}/talks/{code}".
# Leave a template empty to omit that field (e.g. no online Q&A).
livestream_url = "https://www.youtube.com/c/EuroSciPy/videos"
q_and_a_url = ""

